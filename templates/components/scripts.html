<script>
    // ตรวจสอบว่าติ๊ก checkbox อย่างน้อยหนึ่งช่องก่อนส่งฟอร์มกรองข้อมูล
    function validateCheckboxGroup(event, name) {
        var checkboxes = document.querySelectorAll('input[type="checkbox"][name="' + name + '"]');
        var isChecked = Array.prototype.some.call(checkboxes, function (checkbox) {
            return checkbox.checked;
        });
        if (!isChecked) {
            alert("กรุณาเลือกอย่างน้อยหนึ่งช่อง");
            event.preventDefault();
            return false;
        }
        return true;
    }
    function validateCheckbox_brand(event) { return validateCheckboxGroup(event, 'brand'); }
    function validateCheckbox_ram(event) { return validateCheckboxGroup(event, 'ram'); }
    function validateCheckbox_hdd(event) { return validateCheckboxGroup(event, 'hdd_capacity'); }
</script>
